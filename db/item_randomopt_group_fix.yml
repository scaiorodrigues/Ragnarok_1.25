###########################################################################
# Random Option Group — [Hardcore] Encantamento tematico
###########################################################################
#
# Cada familia de equipamento sorteia de um pool proprio, entao uma
# espada nunca recebe encantamento de cajado. O tema e resolvido em
# C++ pelo subtipo da arma ou pelo slot da armadura — ver
# itemdb_hardcore_enchant_group() em itemdb.cpp.
#
# A posicao 1 vem no drop, craft ou quest. As posicoes 2 a 5 sao
# abertas pelo refino do ferreiro, uma a cada 2 niveis (+2/+4/+6/+8).
#
# As chances somam 10000 por posicao, entao a posicao sempre e
# preenchida quando destravada.
###########################################################################

