###########################################################################
# Skill Tree Database - HARDCORE OVERRIDES
###########################################################################
#
# Regra do servidor: NENHUMA classe ressuscita por skill. A unica forma de
# reviver e a Folha de Yggdrasil, que so dropa de 7 MVPs a 0,01%.
#
# MaxLevel: 0 remove a skill da arvore (ver doc/yaml/db/skill_tree.yml).
###########################################################################

Header:
  Type: SKILL_TREE_DB
  Version: 1

Body:
  # ALL_RESURRECTION Lv4 era concedida a Alchemist/Creator por este proprio
  # arquivo (exigia AM_RESURRECTHOMUN 5). Removida.
  - Job: Alchemist
    Tree:
      - Name: ALL_RESURRECTION
        MaxLevel: 0

  - Job: Creator
    Tree:
      - Name: ALL_RESURRECTION
        MaxLevel: 0

  # Redemptio revive o grupo inteiro ao custo da vida do Priest — e
  # ressurreicao por skill, entao sai tambem. (ALL_RESURRECTION ja havia
  # sido removida da arvore de Priest no db/pre-re/skill_tree.yml.)
  - Job: Priest
    Tree:
      - Name: PR_REDEMPTIO
        MaxLevel: 0

  - Job: High_Priest
    Tree:
      - Name: PR_REDEMPTIO
        MaxLevel: 0
