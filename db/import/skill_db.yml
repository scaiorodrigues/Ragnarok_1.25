###########################################################################
# Skill Database - [Hardcore] Telegraphs de solo
###########################################################################
#
# Marcacao no chao avisando onde a skill vai cair, ANTES do dano.
#
# COMO FUNCIONA SEM MEXER NO CLIENT
# O client desenha a marcacao pelo ID DA UNIDADE, nao pelo id da skill:
#
#     unit_id = unit->group->unit_id;     // clif.cpp, clif_getareachar_skillunit
#     ...
#     unit_id = UNT_DUMMYSKILL;           // e assim que se esconde uma armadilha
#
# Ou seja: UNT_DUMMYSKILL e o "invisivel". Varias skills perigosas JA colocam
# uma unidade no chao durante o cast — ela so nao aparece. Trocar o Unit.Id
# para um grafico visivel transforma cada uma num telegraph, com zero
# alteracao de client e zero C++.
#
# O parser mescla campo a campo (SkillDatabase::parseBodyNode faz find() e so
# sobrescreve o que esta no no), entao basta declarar Id, Name e Unit.Id —
# dano, alcance, cast e o resto continuam vindo do db/pre-re/skill_db.yml.
#
# LIMITE CONHECIDO
# So funciona em skill que JA cria unidade. NPC_PULSESTRIKE (cast 3025ms) e
# NPC_HELLJUDGEMENT (1467ms) sao as duas maiores janelas de aviso do jogo,
# mas nao tem bloco Unit — para telegrafar essas duas e preciso chamar
# skill_unitsetting() no C++. Ficam para a proxima leva.
#
# A janela de aviso e o proprio cast time, que ja existe. Nada de novo foi
# adicionado ao tempo — so ficou visivel.
###########################################################################

Header:
  Type: SKILL_DB
  Version: 4

Body:
  # ── Chuva de Meteoros ────────────────────────────────────────────────
  # 1.321 ms de cast, usada por 32 monstros. Campo de fogo marca onde os
  # meteoros vao cair. Dummyskill -> Volcano.
  - Id: 83
    Name: WZ_METEOR
    Unit:
      Id: Volcano

  # ── Tempestade de Raios ──────────────────────────────────────────────
  # 1.500 ms de cast. Campo de vento combina com o elemento da skill.
  # Dummyskill -> Violentgale.
  - Id: 21
    Name: MG_THUNDERSTORM
    Unit:
      Id: Violentgale

  # ── Escuridao Sagrada ────────────────────────────────────────────────
  # 1.100 ms de cast, explosao centrada no conjurador.
  # Evilland NAO serve aqui: NPC_EVILLAND ja usa esse grafico (Banshee,
  # Beelzebub, Entweihen). Dois campos escuros diferentes fariam o jogador
  # ler a mesma imagem como duas coisas — telegraph ambiguo mente.
  # Dummyskill -> Magnus (area sagrada, alto contraste, sem uso por mob).
  - Id: 339
    Name: NPC_GRANDDARKNESS
    Unit:
      Id: Magnus

  # ── Impacto Terrestre ────────────────────────────────────────────────
  # 1.200 ms de cast, area no chao. Usada por 22 monstros da rota de up
  # media: Minorous (52), Joker (57). Dummyskill -> Deluge.
  - Id: 91
    Name: WZ_HEAVENDRIVE
    Unit:
      Id: Deluge

###########################################################################
# TELEGRAPH GENERICO
###########################################################################
#
# A troca de Unit.Id acima so funciona em skill que JA cria unidade de solo.
# Os monstros da rota de up nao usam nenhuma dessas — eles usam NPC_*ATTACK,
# golpes instantaneos sem componente de chao. Para alcancar esses, existe a
# skill visual abaixo e o bloco `Telegraph` (ver s_skill_db em skill.hpp).
#
# HC_TELEGRAPH nao causa dano, nao aplica status e nao tem intervalo: e so
# um desenho no chao. O RAIO configurado em Telegraph.Size vira o NIVEL desta
# skill, e o Layout resolve o tamanho da area.
###########################################################################

  - Id: 10100
    Name: HC_TELEGRAPH
    Description: Aviso de Solo
    MaxLevel: 9
    Type: Magic
    TargetType: Ground
    Range: 14
    Hit: Single
    Flags:
      IsNpc: true
    Unit:
      Id: Warmer
      Layout:
        - Level: 1
          Size: 0
        - Level: 2
          Size: 1
        - Level: 3
          Size: 1
        - Level: 4
          Size: 2
        - Level: 5
          Size: 2
        - Level: 6
          Size: 3
        - Level: 7
          Size: 3
        - Level: 8
          Size: 4
        - Level: 9
          Size: 4
      Interval: -1
      Target: All

###########################################################################
# ROTA DE UP — skills de monstro fraco que passam a avisar
#
# So skills com cast > 0: a janela ja existe, so estava invisivel.
# Nenhum tempo novo foi adicionado ao jogo.
###########################################################################

  # Autodestruicao — 1.842 ms, a maior janela em nivel baixo.
