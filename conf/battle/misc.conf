// Localização: conf/battle/misc.conf
// Alterações do projeto Hardcore Pre-Renewal
// Aplicar: substituir os valores abaixo nos campos correspondentes do arquivo original

// ============================================================
// [Hardcore] @autotrade — venda offline sem multilogin
// ============================================================

// Permite @autotrade em qualquer mapa de cidade (não exige mapflag especial)
at_mapflag: no

// Tempo em minutos antes de kickar o autotrader (0 = nunca — fecha só quando vender tudo)
at_timeout: 0

// Monstros ignoram o autotrader (não agridem a loja parada)
at_monsterignore: yes

// Disparar evento OnPCLogout nos scripts quando @autotrade é usado
at_logout_event: yes

// Nota: os demais campos do misc.conf original permanecem intactos.
