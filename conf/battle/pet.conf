// Localização: conf/battle/pet.conf
// Alterações do projeto Hardcore Pre-Renewal
// Aplicar: substituir os valores abaixo nos campos correspondentes do arquivo original

// ============================================================
// [Hardcore] Habilidades de pets — flags obrigatórias
// Sem essas flags, nenhuma habilidade especial de pet funciona.
// ============================================================

// Habilita skills periódicas (petskillattack, petskillbonus, petheal, petrecovery, petloot)
pet_status_support: yes

// Habilita ataque autônomo do pet (necessário para petskillattack funcionar)
pet_attack_support: yes

// Dano de suporte desabilitado (pet não causa dano adicional passivo)
pet_damage_support: no

// Exige que o pet esteja com o equipamento equipado antes de usar skills
pet_equip_required: yes

// Habilita Perfect Hide do Smokie (bPerfectHide via Script no pet_db.yml)
pet_hide_support: yes

// Habilita loot de itens do chão (Poring, Drops, Poporing, Yoyo)
// 1 = pet recolhe e entrega via Performance; 0 = desabilitado
pet_loot_type: 1

// Nota: os demais campos do pet.conf original permanecem intactos.
